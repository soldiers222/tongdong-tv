# 可选：用 Netlify 发布网页版（已经有 GitHub Pages 自动发布，二选一即可）
[build]
  publish = "web"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
